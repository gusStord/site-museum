name: Deploy Musaeum PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Reconstruct project from uploaded archives
        run: |
          mkdir -p site
          unzip -q -o site-museum-part1.zip -d site
          unzip -q -o site-museum-part2.zip -d site

      - name: Prepare static GitHub Pages build
        env:
          SITE_ROOT: ${{ github.workspace }}/site
          BASE_PATH: /site-museum
        run: python .github/scripts/prepare-pages.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package.json

      - name: Install dependencies
        working-directory: site
        run: npm install --legacy-peer-deps

      - name: Build static site
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /site-museum
        run: npm run build

      - name: Disable Jekyll
        run: touch site/out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
